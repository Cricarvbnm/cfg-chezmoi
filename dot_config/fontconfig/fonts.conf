<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>


<!-- Reference:
https://wiki.archlinuxcn.org/wiki/%E5%AD%97%E4%BD%93%E9%85%8D%E7%BD%AE/%E4%B8%AD%E6%96%87#Windows_%E6%98%BE%E7%A4%BA%E6%95%88%E6%9E%9C%E7%9A%84%E5%AD%97%E4%BD%93%E5%8F%82%E8%80%83%E9%85%8D%E7%BD%AE -->

<fontconfig>
  <!-- Disable embedded bitmap fonts -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Default English Fonts -->
  <match>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name='family' mode='prepend' binding='strong'>
      <string>Source Han Serif CN</string>
    </edit>
  </match>
  <match>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name='family' mode='prepend' binding='strong'>
      <string>Source Han Sans CN</string>
    </edit>
  </match>
  <match>
    <test name='lang' compare='contains'>
      <string>zh</string>
    </test>
    <test name='family'>
      <string>monospace</string>
    </test>
    <edit name='family' mode='prepend' binding='strong'>
      <string>Sarasa Fixed SC</string>
    </edit>
    <edit name='family' mode='prepend' binding='strong'>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <!-- 中文默认字体 -->
  <match>
    <test name='lang' compare='contains'>
      <string>zh</string>
    </test>
    <test name='family'>
      <string>serif</string>
    </test>
    <edit name='family' mode='prepend'>
      <string>Source Han Serif CN</string>
    </edit>
  </match>
  <match>
    <test name='lang' compare='contains'>
      <string>zh</string>
    </test>
    <test name='family'>
      <string>sans-serif</string>
    </test>
    <edit name='family' mode='prepend'>
      <string>Source Han Sans CN</string>
    </edit>
  </match>
  <match>
    <test name='lang' compare='contains'>
      <string>zh</string>
    </test>
    <test name='family'>
      <string>monospace</string>
    </test>
    <edit name='family' mode='prepend' binding='strong'>
      <string>Sarasa Fixed SC</string>
    </edit>
    <edit name='family' mode='prepend' binding='strong'>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <!-- 把所有常见的中文字体映射到思源黑体和思源宋体，
  这样当这些字体未安装时会使用思源黑体和思源宋体.
  解决特定程序指定使用某字体，
  并且在字体不存在情况下不会使用fallback字体导致中文显示不正常的情况. -->
  <match target="pattern">
    <test name="family">
      <string>WenQuanYi Zen Hei</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans CN</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>WenQuanYi Micro Hei</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans CN</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>WenQuanYi Micro Hei Light</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans CN</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Microsoft YaHei</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans CN</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>SimHei</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans CN</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>SimSun</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif CN</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>SimSun-18030</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif CN</string>
    </edit>
  </match>
</fontconfig>
